name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# macOS runners are expensive, so a newer push to the same branch or pull request cancels the run before it.
# release.yml requires the tagged commit's run to have passed: tag the latest commit of main, or rerun its ci.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The package needs macOS 26 and Swift 6.2, which this image's Xcode 26 provides.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Real permissions are unavailable here, so the live test stays local (LIVE=1).
      - run: swift --version
      # SwiftLint's own release, checked against its published digest; the rules are in .swiftlint.yml.
      - name: Lint
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --quiet
      # The app bundle as users build it: release build, assembly, ad hoc signature and its verification. Warnings
      # fail the build, but the release build reports some concurrency diagnostics that -warnings-as-errors leaves
      # as warnings and the debug build does not report, so the log is checked too.
      - name: make app, without warnings
        run: |
          set -o pipefail
          make app 2>&1 | tee "$RUNNER_TEMP/app.log"
          if grep -n 'warning:' "$RUNNER_TEMP/app.log"; then echo "The release build has warnings" >&2; exit 1; fi
      - run: swiftc -typecheck Tests/Fixtures/target/main.swift
      - run: swift test

  thread-sanitizer:
    # The same tests with the thread sanitizer, which reports the data races they run into. The helper and the command
    # the tests start are built with it too and inherit TSAN_OPTIONS, so their reports, which would go to output the
    # tests discard, are written to files, and any report fails the job.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests under the thread sanitizer
        run: |
          mkdir -p "$RUNNER_TEMP/tsan"
          TSAN_OPTIONS="log_path=$RUNNER_TEMP/tsan/report" swift test --sanitize=thread
      - name: No data race reported, by the tests or the processes they started
        if: always()
        run: |
          if ls "$RUNNER_TEMP/tsan"/report.* >/dev/null 2>&1; then cat "$RUNNER_TEMP/tsan"/report.*; exit 1; fi
