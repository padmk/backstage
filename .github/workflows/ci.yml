name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Real permissions are unavailable here, so the live test stays local (LIVE=1).
      - run: swift --version
      # The app bundle as users build it: release build, assembly, ad hoc signature and its verification.
      - run: make app
      - run: swiftc -typecheck Tests/Fixtures/target/main.swift
      - run: swift test
